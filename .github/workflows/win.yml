name: Windows

on:
  workflow_dispatch:

jobs:
  windows:
    name: Windows
    runs-on: windows-2022
    timeout-minutes: 360

    strategy:
      matrix:
        arch: [x64]
        qt: [qt6]
        generator: [""]

    env:
      UPLOAD_ARTIFACT: "true"
      ONLY_CACHE: "false"
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"

    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories
        run: |
          if not exist "%USERPROFILE%\TBuild\Libraries" mkdir "%USERPROFILE%\TBuild\Libraries"
          if not exist "%GITHUB_WORKSPACE%\TBuild" mklink /d "%GITHUB_WORKSPACE%\TBuild" "%USERPROFILE%\TBuild"
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>"%GITHUB_ENV%"
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>"%GITHUB_ENV%"

      - name: Get repository name
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> "$GITHUB_ENV"

      - name: Clone
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          path: TBuild/${{ env.REPO_NAME }}

      - name: First set up
        shell: bash
        run: |
          DOCPATH="$TBUILD/$REPO_NAME/docs/building-win.md"
          if [ ! -f "$DOCPATH" ]; then
            echo "ERROR: Documentation file not found: $DOCPATH"
            exit 1
          fi

          # Extract only the four-part numeric SDK version from a sentence such as:
          # The build is done in **Visual Studio 2026** with **10.0.26100.0** SDK version.
          SDK_LINE="$(grep -m1 'SDK version' "$DOCPATH" || true)"
          SDK="$(printf '%s\n' "$SDK_LINE" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' | tail -n1 || true)"
          if ! [[ "$SDK" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Could not extract a numeric Windows SDK version from $DOCPATH"
            echo "Matched line: $SDK_LINE"
            exit 1
          fi

          echo "Detected Windows SDK: $SDK"
          echo "SDK=$SDK" >> "$GITHUB_ENV"

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          # Bump this marker when build-toolchain behavior changes.
          echo "windows-2022-toolset-v5-nasm-2.16.03" >> CACHE_KEY.txt
          echo "$(sha256sum "$TBUILD/$REPO_NAME/$PREPARE_PATH" | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> "$GITHUB_ENV"

          echo "Configurate git for cherry-picks."
          git config --global user.email "you@example.com"
          git config --global user.name "Sample"

      - name: Native Tools Command Prompt
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: ${{ matrix.arch }}
          sdk: ${{ env.SDK }}
          toolset: 14.44

      - name: NuGet sources
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      # Restore with a per-attempt key prefix. The save steps at the end use a
      # unique run/attempt key, so failed builds can publish their partial cache.
      - name: Restore ThirdParty cache
        id: cache-third-party
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-v5-${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.OS }}-${{ runner.arch }}-third-party-v5-${{ env.CACHE_KEY }}-
            ${{ runner.OS }}-${{ runner.arch }}-third-party-v5-

      - name: Restore Libraries cache
        id: cache-libs
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-${{ matrix.arch }}-libs-v5-${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.OS }}-${{ matrix.arch }}-libs-v5-${{ env.CACHE_KEY }}-
            ${{ runner.OS }}-${{ matrix.arch }}-libs-v5-

      - name: Restore Qt cache
        id: cache-qt
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-${{ matrix.arch }}-${{ matrix.qt || 'qt' }}-v5-${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.OS }}-${{ matrix.arch }}-${{ matrix.qt || 'qt' }}-v5-${{ env.CACHE_KEY }}-
            ${{ runner.OS }}-${{ matrix.arch }}-${{ matrix.qt || 'qt' }}-v5-

      - name: Patch prepare.py (diffutils and NASM 2.16.03)
        shell: pwsh
        run: |
          $prep = Join-Path $env:TBUILD "$env:REPO_NAME\$env:PREPARE_PATH"
          if (-not (Test-Path $prep)) {
            throw "prepare.py not found: $prep"
          }

          $content = Get-Content $prep -Raw
          $content = $content.Replace(
            'mingw-w64-x86_64-diffutils',
            'diffutils'
          )

          # Do not delete a valid cached libvpx checkout after a failed build.
          # Keep its untracked MSBuild objects so make can continue incrementally.
          $removeTarget = "commands = removeDir(stage['name']) + '\n' + stage['commands']"
          $removeReplacement = @'
          if win and stage['name'] == 'libvpx' and os.path.isdir(os.path.join(stage['directory'], 'libvpx', '.git')):
                      commands = stage['commands']
                  else:
                      commands = removeDir(stage['name']) + '\n' + stage['commands']
          '@

          if (-not $content.Contains($removeTarget)) {
            throw "Could not find prepare.py stage cleanup line; refusing to disable cleanup blindly."
          }
          $content = $content.Replace($removeTarget, $removeReplacement.Trim())

          # reset only tracked source files; keep untracked x64/Debug build objects.
          $checkoutTarget = 'git checkout v1.14.1'
          if (-not $content.Contains($checkoutTarget)) {
            throw "Could not find libvpx v1.14.1 checkout command."
          }
          $content = $content.Replace($checkoutTarget, 'git reset --hard v1.14.1')

          # prepare.py installs the current MSYS2 NASM (3.02). Replace its
          # libvpx invocation so it downgrades MSYS2 NASM and clears possibly
          # corrupt object files left by the failing 3.02 assembler.
          $target = 'bash --login ../patches/build_libvpx_win.sh'
          $replacement = @'
          bash --login -c "pacman -U --noconfirm https://repo.msys2.org/mingw/mingw64/mingw-w64-x86_64-nasm-2.16.03-1-any.pkg.tar.zst && echo NASM version used for libvpx: && which nasm && nasm -v && rm -f x64/Debug/vpx/*.obj x64/Debug/vpxrc/*.obj && bash ../patches/build_libvpx_win.sh"
          '@

          if (-not $content.Contains($target)) {
            throw "Could not find libvpx build command in prepare.py; refusing to patch a different script."
          }

          $content = $content.Replace($target, $replacement.Trim())
          Set-Content -Path $prep -Value $content -NoNewline -Encoding utf8NoBOM

          if (-not $content.Contains('mingw-w64-x86_64-nasm-2.16.03-1-any.pkg.tar.zst') -or
              -not $content.Contains("git reset --hard v1.14.1")) {
            throw "One or more incremental libvpx fixes were not inserted."
          }

          Write-Host "prepare.py patched: NASM 2.16.03 pinned; partial libvpx checkout retained; stale object files cleared."

      - name: Detect Visual Studio path
        shell: pwsh
        run: |
          $vsPath = (Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\*\VC\Auxiliary\Build\vcvarsall.bat" |
            Select-Object -First 1).FullName

          if (-not $vsPath) {
            throw "vcvarsall.bat not found"
          }

          # vcvarsall.bat is under VSROOT\VC\Auxiliary\Build.
          # Four parent operations are required to get VSROOT.
          $rootPath = Split-Path -Parent (
            Split-Path -Parent (
              Split-Path -Parent (
                Split-Path -Parent $vsPath
              )
            )
          )

          "GYP_MSVS_OVERRIDE_PATH=$rootPath" >> $env:GITHUB_ENV
          "GYP_MSVS_VERSION=2022" >> $env:GITHUB_ENV
          Write-Host "Detected Visual Studio root: $rootPath"

      - name: Build third-party libraries
        run: |
          for /L %%i in (1,1,1) do (
            call %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat silent ${{ matrix.qt }}
            if not errorlevel 1 exit /b 0
            echo Attempt %%i failed.
          )
          exit /b 1

      - name: Read configuration matrix
        shell: bash
        run: |
          ARTIFACT_NAME="Telegram"
          ARCH=""

          if [ -n "${{ matrix.arch }}" ]; then
            case "${{ matrix.arch }}" in
              x64_x86) ARCH="x86" ;;
              arm64) ARCH="arm" ;;
              *) ARCH="${{ matrix.arch }}" ;;
            esac
            echo "Architecture from matrix: $ARCH"
            ARTIFACT_NAME="${ARTIFACT_NAME} ${{ matrix.arch }}"
          fi

          if [ -n "${{ matrix.qt }}" ]; then
            ARTIFACT_NAME="${ARTIFACT_NAME} ${{ matrix.qt }}"
          fi

          GENERATOR=""
          if [ -n "${{ matrix.generator }}" ]; then
            GENERATOR="-G \"${{ matrix.generator }}\""
            echo "Generator from matrix: $GENERATOR"
            ARTIFACT_NAME="${ARTIFACT_NAME} ${{ matrix.generator }}"
          fi

          echo "TDESKTOP_BUILD_GENERATOR=$GENERATOR" >> "$GITHUB_ENV"
          [ -n "$GENERATOR" ] && ARCH=""

          echo "TDESKTOP_BUILD_ARCH=$ARCH" >> "$GITHUB_ENV"

          DEFINE=""
          if [ -n "${{ matrix.defines }}" ]; then
            DEFINE="-D ${{ matrix.defines }}=ON"
            echo "Define from matrix: $DEFINE"
            ARTIFACT_NAME="${ARTIFACT_NAME} ${{ matrix.defines }}"
          fi

          echo "TDESKTOP_BUILD_DEFINE=$DEFINE" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> "$GITHUB_ENV"

          API="-D TDESKTOP_API_TEST=ON"
          if [ "$GITHUB_REF" = "refs/heads/nightly" ]; then
            echo "Use the open credentials."
            API="-D TDESKTOP_API_ID=611335 -D TDESKTOP_API_HASH=d524b414d21f4d37f08684c1df41ac9c"
          fi

          echo "TDESKTOP_BUILD_API=$API" >> "$GITHUB_ENV"

      - name: Free up some disk space
        shell: bash
        run: |
          find "$LibrariesPath" '(' '(' ! '(' \
            -name '*.lib' -o \
            -name '*.a' -o \
            -name '*.exe' -o \
            -name '*.h' -o \
            -name '*.hpp' -o \
            -name '*.inc' -o \
            -name '*.cmake' -o \
            -path '*/include/*' -o \
            -path '*/objects-*' -o \
            -path '*/cache_keys/*' -o \
            -path '*/patches/*' \
          ')' -type f ')' -o -empty ')' -delete

      - name: Telegram Desktop build
        if: env.ONLY_CACHE == 'false'
        run: |
          cd "%TBUILD%\%REPO_NAME%\Telegram"
          call configure.bat ^
            %TDESKTOP_BUILD_GENERATOR% ^
            %TDESKTOP_BUILD_ARCH% ^
            ${{ matrix.qt }} ^
            %TDESKTOP_BUILD_API% ^
            -D CMAKE_CONFIGURATION_TYPES=Release ^
            -D CMAKE_COMPILE_WARNING_AS_ERROR=OFF ^
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF ^
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF ^
            %TDESKTOP_BUILD_DEFINE%
          if errorlevel 1 exit /b %errorlevel%

          cmake --build ..\out --config Release --parallel
          if errorlevel 1 exit /b %errorlevel%

      - name: Collect artifact
        if: env.ONLY_CACHE == 'false' && ((env.UPLOAD_ARTIFACT == 'true') || (github.ref == 'refs/heads/nightly'))
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:TBUILD "$env:REPO_NAME\out\Release"

          New-Item -ItemType Directory -Force -Path artifact | Out-Null

          foreach ($f in @('Telegram.exe', 'Updater.exe')) {
            $src = Join-Path $out $f
            if (-not (Test-Path $src)) {
              throw "Missing build output: $src"
            }
            Copy-Item $src -Destination artifact\
          }

          Get-ChildItem artifact

      - name: Upload artifact
        if: env.ONLY_CACHE == 'false' && ((env.UPLOAD_ARTIFACT == 'true') || (github.ref == 'refs/heads/nightly'))
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifact\
          if-no-files-found: error

      # These are separate save actions with unique keys, and run after a
      # failure as well. The next workflow attempt restores the newest prefix match.
      - name: Save ThirdParty cache (even after failure)
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-v5-${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save Libraries cache (even after failure)
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-${{ matrix.arch }}-libs-v5-${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save Qt cache (even after failure)
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-${{ matrix.arch }}-${{ matrix.qt || 'qt' }}-v5-${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}
