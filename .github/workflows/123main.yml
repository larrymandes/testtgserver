name: Diagnostic Windows Build Env

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: windows-2022
    steps:
      - name: Print exact build_libvpx_win.sh from desktop-app/patches
        shell: pwsh
        run: |
          git clone https://github.com/desktop-app/patches.git
          cd patches
          git checkout 4519c85c924b9da81f29d4aac045886f896ee479
          Write-Host "=== build_libvpx_win.sh ==="
          Get-Content "build_libvpx_win.sh"
          Write-Host "=== build_ffmpeg_win.sh ==="
          Get-Content "build_ffmpeg_win.sh"
